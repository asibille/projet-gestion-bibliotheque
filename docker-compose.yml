  book-service:
    build: ./book-service
    container_name: book-service
    ports:
      - "8091:8091"
    depends_on:
      - config-server
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/

  loan-service:
    build: ./loan-service
    container_name: loan-service
    ports:
      - "8092:8092"
    depends_on:
      - config-server
      - book-service
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/

networks:
  default:
    name: gestion-bibliotheque-network
